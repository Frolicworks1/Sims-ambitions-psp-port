name: HyperHLE workflow test

on:
  push:
    paths:
      - ".github/workflows/hyperhle-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HyperHLE
        uses: actions/checkout@v4
        with:
          repository: KlugKlugTG/HyperHLE-Fork
          ref: trunk
          path: hyperhle
          submodules: recursive
          fetch-depth: 0
      - run: test -f hyperhle/Cargo.toml && echo "checkout-ok"
