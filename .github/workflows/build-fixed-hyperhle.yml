name: Build fixed HyperHLE Android APK

on:
  push:
    paths:
      - ".github/workflows/build-fixed-hyperhle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HyperHLE source
        uses: actions/checkout@v4
        with:
          repository: KlugKlugTG/HyperHLE-Fork
          ref: trunk
          path: hyperhle
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Patch UITextField IME re-entry
        working-directory: hyperhle
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/frameworks/uikit/ui_view/ui_control/ui_text_field.rs")
          s = p.read_text()
          marker = "    content_vertical_alignment: NSInteger,\\n"
          if "text_input_in_progress: bool" not in s:
              s = s.replace(marker, marker + "    text_input_in_progress: bool,\\n", 1)
          marker = "            content_vertical_alignment: 0,\\n"
          if "text_input_in_progress: false" not in s:
              s = s.replace(marker, marker + "            text_input_in_progress: false,\\n", 1)

          start = s.index("- (())setText:(id)text {")
          end = s.index("\\n}\\n\\n- (id)attributedText", start) + 2
          s = s[:start] + """- (())setText:(id)text {
    let suppress = env.objc.borrow::<UITextFieldHostObject>(this).text_input_in_progress;
    let text_label = env.objc.borrow::<UITextFieldHostObject>(this).text_label;
    let _: () = msg![env; text_label setText:text];
    if !suppress {
        let center: id = msg_class![env; NSNotificationCenter defaultCenter];
        let name = ns_string::get_static_str(env, UITextFieldTextDidChangeNotification);
        let _: () = msg![env; center postNotificationName:name object:this userInfo:nil];
    }
}""" + s[end:]

          def replace_handler(name, next_name, body):
              nonlocal s
              start = s.index("pub fn " + name)
              end = s.index("\\npub fn " + next_name, start)
              s = s[:start] + body + s[end:]

          replace_handler("handle_text", "handle_backspace", """pub fn handle_text(env: &mut Environment, text_field: id, text: String) {
    if env.objc.borrow::<UITextFieldHostObject>(text_field).text_input_in_progress { return; }
    env.objc.borrow_mut::<UITextFieldHostObject>(text_field).text_input_in_progress = true;
    let txt = ns_string::from_rust_string(env, text);
    let text_label = env.objc.borrow::<UITextFieldHostObject>(text_field).text_label;
    let curr_text: id = msg![env; text_label text];
    let curr_text = if curr_text == nil { ns_string::get_static_str(env, "") } else { curr_text };
    let len: NSUInteger = msg![env; curr_text length];
    let range = NSRange { location: len, length: 0 };
    let delegate = env.objc.borrow::<UITextFieldHostObject>(text_field).delegate;
    let mut should = true;
    if delegate != nil && env.mem.read(delegate.cast()) != 0 {
        let sel: SEL = env.objc.register_host_selector("textField:shouldChangeCharactersInRange:replacementString:".to_string(), &mut env.mem);
        if msg![env; delegate respondsToSelector:sel] {
            should = msg![env; delegate textField:text_field shouldChangeCharactersInRange:range replacementString:txt];
        }
    }
    if should {
        let new_text: id = msg![env; curr_text stringByAppendingString:txt];
        let _: () = msg![env; text_field setText:new_text];
        let _: () = msg![env; text_field setNeedsDisplay];
        release(env, new_text);
        let center: id = msg_class![env; NSNotificationCenter defaultCenter];
        let name = ns_string::get_static_str(env, UITextFieldTextDidChangeNotification);
        let _: () = msg![env; center postNotificationName:name object:text_field userInfo:nil];
    }
    release(env, txt);
    env.objc.borrow_mut::<UITextFieldHostObject>(text_field).text_input_in_progress = false;
}""")

          replace_handler("handle_backspace", "handle_return", """pub fn handle_backspace(env: &mut Environment, text_field: id) {
    if env.objc.borrow::<UITextFieldHostObject>(text_field).text_input_in_progress { return; }
    let text_label = env.objc.borrow::<UITextFieldHostObject>(text_field).text_label;
    let curr_text: id = msg![env; text_label text];
    let len: NSUInteger = msg![env; curr_text length];
    if len == 0 { return; }
    env.objc.borrow_mut::<UITextFieldHostObject>(text_field).text_input_in_progress = true;
    let range = NSRange { location: len - 1, length: 1 };
    let empty = ns_string::get_static_str(env, "");
    let delegate = env.objc.borrow::<UITextFieldHostObject>(text_field).delegate;
    let mut should = true;
    if delegate != nil && env.mem.read(delegate.cast()) != 0 {
        let sel: SEL = env.objc.register_host_selector("textField:shouldChangeCharactersInRange:replacementString:".to_string(), &mut env.mem);
        if msg![env; delegate respondsToSelector:sel] {
            should = msg![env; delegate textField:text_field shouldChangeCharactersInRange:range replacementString:empty];
        }
    }
    if should {
        let new_text: id = msg![env; curr_text substringToIndex:(len - 1)];
        let _: () = msg![env; text_field setText:new_text];
        let _: () = msg![env; text_field setNeedsDisplay];
        let center: id = msg_class![env; NSNotificationCenter defaultCenter];
        let name = ns_string::get_static_str(env, UITextFieldTextDidChangeNotification);
        let _: () = msg![env; center postNotificationName:name object:text_field userInfo:nil];
    }
    env.objc.borrow_mut::<UITextFieldHostObject>(text_field).text_input_in_progress = false;
}""")

          p.write_text(s)
          print("IME re-entry guard applied")

      - name: Patch Android C++ runtime linkage
        working-directory: hyperhle
        shell: python
        run: |
          from pathlib import Path
          p = Path("build.rs")
          s = p.read_text()
          old = '''    if std::env::var("CARGO_CFG_TARGET_OS").unwrap() == "android" {
        println!("cargo:rustc-link-lib=c++_shared");
        let sysroot_libs_path =
            PathBuf::from(std::env::var_os("CARGO_NDK_SYSROOT_LIBS_PATH").unwrap());
        let lib_path = sysroot_libs_path.join("libc++_shared.so");
        std::fs::copy(
            lib_path,
            // cargo-ndk as invoked by cargo-ndk-android-gradle actually
            // copies from the target directory, using this hacky path
            // concatenation approach. :(
            package_root
                .join("target")
                .join(std::env::var("TARGET").unwrap())
                .join(std::env::var("PROFILE").unwrap())
                .join("libc++_shared.so"),
        )
        .unwrap();
    }
'''
          new = '''    if std::env::var("CARGO_CFG_TARGET_OS").unwrap() == "android" {
        // Link the NDK C++ runtime statically. Dynarmic's iostream RTTI/vtables
        // are not all exported by the shared runtime packaged by cargo-ndk.
        let sysroot_libs_path =
            PathBuf::from(std::env::var_os("CARGO_NDK_SYSROOT_LIBS_PATH").unwrap());
        println!("cargo:rustc-link-search=native={}", sysroot_libs_path.display());
        println!("cargo:rustc-link-lib=static=c++_static");
        println!("cargo:rustc-link-lib=static=c++abi");
    }
'''
          if old not in s:
              raise SystemExit("Android libc++ build.rs block not found")
          p.write_text(s.replace(old, new, 1))
          print("Android C++ runtime patch applied")

      - name: Build Android AArch64 APK
        working-directory: hyperhle
        shell: bash
        env:
          HYPERHLE_KEYSTORE_B64: ${{ secrets.HYPERHLE_KEYSTORE_B64 }}
          HYPERHLE_KEYSTORE_PASSWORD: ${{ secrets.HYPERHLE_KEYSTORE_PASSWORD }}
          HYPERHLE_KEY_ALIAS: ${{ secrets.HYPERHLE_KEY_ALIAS }}
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq p7zip-full
          cargo install cargo-ndk@3.5.4
          rustup target add aarch64-linux-android
          mkdir -p vendor
          curl -L -o boost_1_81_0.7z https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z
          7z -ovendor x boost_1_81_0.7z
          mv vendor/boost_1_81_0 vendor/boost
          curl -L -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
          tar xzf cmake.tar.gz -C vendor
          mv vendor/cmake-3.31.6-linux-x86_64 vendor/cmake
          mkdir -p android-ndk
          curl -L -o android-ndk-r25c-linux.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          7z -oandroid-ndk -snld x android-ndk-r25c-linux.zip
          ln -s "$PWD/android-ndk/android-ndk-r25c" "$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          curl -L -o gradle-8.11.1-bin.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          mkdir -p gradle
          7z -ogradle x gradle-8.11.1-bin.zip
          cd android
          ../gradle/gradle-8.11.1/bin/gradle assembleRelease
          cp app/build/outputs/apk/release/HyperHLE-Fork-release.apk ../HyperHLE-Fixed-Sims-Keyboard.apk

      - name: Verify real APK
        working-directory: hyperhle
        run: |
          test -s HyperHLE-Fixed-Sims-Keyboard.apk
          unzip -l HyperHLE-Fixed-Sims-Keyboard.apk | grep -q AndroidManifest.xml
          unzip -l HyperHLE-Fixed-Sims-Keyboard.apk | grep -q 'lib/arm64-v8a'
          rm -rf /tmp/hle-apk-check && mkdir -p /tmp/hle-apk-check
          unzip -q HyperHLE-Fixed-Sims-Keyboard.apk 'lib/arm64-v8a/libtouchHLE.so' -d /tmp/hle-apk-check
          if readelf -d /tmp/hle-apk-check/lib/arm64-v8a/libtouchHLE.so | grep -q 'libc++_shared.so'; then
            echo 'ERROR: libtouchHLE.so still depends on libc++_shared.so'
            exit 1
          fi
          echo 'OK: no libc++_shared.so dependency'

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperHLE-Fixed-Sims-Keyboard-AArch64
          path: hyperhle/HyperHLE-Fixed-Sims-Keyboard.apk
