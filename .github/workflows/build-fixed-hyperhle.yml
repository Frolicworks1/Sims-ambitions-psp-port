name: Build fixed HyperHLE Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HyperHLE
        uses: actions/checkout@main
        with:
          repository: KlugKlugTG/HyperHLE-Fork
          ref: trunk
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@main
        with:
          path: vendor/boost
          key: boost_1_81_0
      - if: steps.cache-boost.outputs.cache-hit != 'true'
        run: curl -L -o boost_1_81_0.7z https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z
      - if: steps.cache-boost.outputs.cache-hit != 'true'
        run: mkdir -p vendor && 7z -ovendor x boost_1_81_0.7z && mv vendor/boost_1_81_0 vendor/boost

      - name: Cache CMake
        id: cache-cmake
        uses: actions/cache@main
        with:
          path: vendor/cmake
          key: cmake_3_31_6_linux
      - if: steps.cache-cmake.outputs.cache-hit != 'true'
        run: curl -L -O https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
      - if: steps.cache-cmake.outputs.cache-hit != 'true'
        run: tar xzf cmake-3.31.6-linux-x86_64.tar.gz -C vendor && mv vendor/cmake-3.31.6-linux-x86_64 vendor/cmake

      - name: Install Android target
        run: rustup target add aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk@3.5.4

      - name: Cache Gradle
        id: cache-gradle
        uses: actions/cache@main
        with:
          path: gradle
          key: gradle-8.11.1
      - if: steps.cache-gradle.outputs.cache-hit != 'true'
        run: curl -L -o gradle-8.11.1-bin.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
      - if: steps.cache-gradle.outputs.cache-hit != 'true'
        run: 7z -ogradle x gradle-8.11.1-bin.zip

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@main
        with:
          path: android-ndk
          key: android-ndk-r25c
      - if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: curl -L -o android-ndk-r25c-linux.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
      - if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: 7z -oandroid-ndk -snld x android-ndk-r25c-linux.zip

      - name: Link NDK
        run: ln -s $PWD/android-ndk/android-ndk-r25c $ANDROID_SDK_ROOT/ndk/25.2.9519653
      - name: Android local.properties
        run: echo sdk.dir=$ANDROID_SDK_ROOT > android/local.properties

      - name: Build APK
        env:
          HYPERHLE_KEYSTORE_B64: ${{ secrets.HYPERHLE_KEYSTORE_B64 }}
          HYPERHLE_KEYSTORE_PASSWORD: ${{ secrets.HYPERHLE_KEYSTORE_PASSWORD }}
          HYPERHLE_KEY_ALIAS: ${{ secrets.HYPERHLE_KEY_ALIAS }}
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake
        run: cd android && ../gradle/gradle-8.11.1/bin/gradle assembleRelease && mv app/build/outputs/apk/release/HyperHLE-Fork-release.apk ../HyperHLE-Fixed-Sims-Keyboard.apk

      - name: Verify real APK
        run: |
          test -s HyperHLE-Fixed-Sims-Keyboard.apk
          unzip -l HyperHLE-Fixed-Sims-Keyboard.apk | grep -q AndroidManifest.xml
          unzip -l HyperHLE-Fixed-Sims-Keyboard.apk | grep -q 'lib/arm64-v8a'

      - name: Upload APK
        uses: actions/upload-artifact@main
        with:
          name: HyperHLE-Fixed-Sims-Keyboard-AArch64
          path: HyperHLE-Fixed-Sims-Keyboard.apk

      - name: Attach APK to Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: hyperhle-fixed-latest
          name: HyperHLE Fixed APK - Latest
          body: HyperHLE Android AArch64 APK build.
          files: HyperHLE-Fixed-Sims-Keyboard.apk
          prerelease: true
          make_latest: true
          fail_on_unmatched_files: true
